[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theoracle"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
